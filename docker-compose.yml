services:
  mysql:
    image: mysql:8.0
    container_name: smanager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smanager}
      MYSQL_USER: ${MYSQL_USER:-smanager}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smanager123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smanager-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-smanager}:${MYSQL_PASSWORD:-smanager123}@mysql:3306/${MYSQL_DATABASE:-smanager}?charset=utf8mb4
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-720}
      SERVER_API_BASE_URL: ${SERVER_API_BASE_URL:-http://10.40.140.17:8765}
      SERVER_API_TOKEN: ${SERVER_API_TOKEN:-}
      LOCAL_FNL_CACHE_DIR: runtime/fnl
      LOCAL_PRODUCTS_DIR: runtime/products
      LOCAL_LOGS_DIR: runtime/logs
      LOCAL_MANIFESTS_DIR: runtime/manifests
      LOCAL_CACHE_DIR: runtime/cache
      TZ: Asia/Shanghai
    volumes:
      - ./runtime:/app/runtime
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: smanager-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  mysql_data:
